global:
  scrape_interval: 15s

scrape_configs:
  # Monitor your backend (add /metrics endpoint)
  - job_name: 'eduresume-backend'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: '/metrics'

  # Docker container metrics (cAdvisor)
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
