name: CI - Tests & Security Scan

on:
  push:
    branches: [main, develop, frontend-development]
  pull_request:
    branches: [main, develop, frontend-development]

permissions:
  contents: read
  security-events: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm run test --if-present -- --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      # FRONTEND TESTS SKIPPED ON PURPOSE
      - name: Skip frontend tests (temporarily)
        run: echo "Skipping frontend tests for now"

      - name: Build frontend application
        working-directory: ./frontend
        run: npm run build

  npm-audit-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=critical || true

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=critical || true

  codeql-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # REPORT-ONLY MODE (does NOT fail CI even if leaks found)
      - name: Run Gitleaks via Docker
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source="/repo" --no-git --redact --exit-code 0

        # If you want strict mode later, remove "--exit-code 0" above.

  build-backend-image:
    needs: [backend-tests, codeql-scan, gitleaks-scan]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: eduresume-backend:latest
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          overwrite: true

  build-frontend-image:
    needs: [frontend-tests, codeql-scan, gitleaks-scan]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: eduresume-frontend:latest
          outputs: type=docker,dest=/tmp/frontend-image.tar

      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          overwrite: true

  trivy-scan:
    needs: [build-backend-image, build-frontend-image]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: Load backend image
        run: docker load --input /tmp/backend-image.tar

      - name: Load frontend image
        run: docker load --input /tmp/frontend-image.tar

      - name: Run Trivy scan on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eduresume-backend:latest
          format: sarif
          output: backend-trivy-results.sarif

      - name: Run Trivy scan on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eduresume-frontend:latest
          format: sarif
          output: frontend-trivy-results.sarif

      - name: Upload Trivy results (backend)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend-trivy-results.sarif
          category: trivy-backend

      - name: Upload Trivy results (frontend)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: frontend-trivy-results.sarif
          category: trivy-frontend

  deploy-render:
    needs: [backend-tests, frontend-tests, codeql-scan, gitleaks-scan, trivy-scan, npm-audit-scan]
    runs-on: ubuntu-latest
    environment: EduResumePRO

    steps:
      - uses: actions/checkout@v3

      - name: Deploy Frontend to Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" ]; then
            curl -X POST \
              "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
              -H 'Content-Type: application/json'
          else
            echo "Skip frontend deploy: Hook not provided."
          fi

      - name: Deploy Backend to Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" ]; then
            curl -X POST \
              "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
              -H 'Content-Type: application/json'
          else
            echo "Skip backend deploy: Hook not provided."
          fi

  ci-status:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, codeql-scan, gitleaks-scan, trivy-scan, npm-audit-scan]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ||
                "${{ needs.frontend-tests.result }}" != "success" ||
                "${{ needs.codeql-scan.result }}" != "success" ||
                "${{ needs.gitleaks-scan.result }}" != "success" ||
                "${{ needs.trivy-scan.result }}" != "success" ]]; then
            echo "❌ CI/Security checks failed"
            exit 1
          fi
          echo "✅ All CI/Security checks passed"
